[project]
name = "notiemoji"
version = "0.1.0"
description = "Genera wallpapers PNG con un fondo de color plano y texto o emojis centrados"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

# Dependencias de producción: solo lo necesario para servir la CLI y la API.
# Nada de tests ni httpx: eso va en el grupo de desarrollo [dependency-groups].dev.
dependencies = [
    "Pillow>=10.1.0",
    "fastapi>=0.126.0",
    "uvicorn>=0.32.0",
]

# Grupo de desarrollo (estándar de uv): `uv sync` lo instala por defecto.
# fastapi.testclient.TestClient lo necesita para transporte HTTP.
[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "ruff>=0.14.0",
    "ty>=0.0.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# El proyecto son dos módulos sueltos en la raíz, no un paquete.
[tool.setuptools]
py-modules = ["notiemoji", "api"]

# ruff: linting y formateo.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

# ty: type checking estático.
[tool.ty.environment]
python-version = "3.11"
