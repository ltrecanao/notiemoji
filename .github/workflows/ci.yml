name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Solo lectura: el workflow no tiene por qué escribir en el repo.
permissions:
  contents: read

# Única fuente de verdad de la versión de Python en el CI. El paso
# "Versiones" falla si Dockerfile o render.yaml dicen otra cosa, así que
# las tres no pueden divergir sin que el build se ponga rojo.
env:
  PYTHON_VERSION: "3.13"

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Versiones
        run: |
          docker_py=$(awk '/^FROM python:/ {sub(/^FROM python:/,""); sub(/-.*/,""); print; exit}' Dockerfile)
          render_py=$(awk '/key: PYTHON_VERSION/{getline; gsub(/[^0-9.]/,""); print; exit}' render.yaml)
          echo "CI          : $PYTHON_VERSION"
          echo "Dockerfile  : $docker_py"
          echo "render.yaml : $render_py"
          if [ "$docker_py" != "$PYTHON_VERSION" ] || [ "$render_py" != "$PYTHON_VERSION" ]; then
            echo "::error::Las versiones de Python divergieron: Dockerfile=$docker_py render.yaml=$render_py CI=$PYTHON_VERSION"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Dos tests dependen del sistema: uno exige NotoColorEmoji.ttf con
      # tablas CBDT/CBLC y el otro los estilos Oblique de DejaVu. Sin estos
      # paquetes fallan en un runner limpio.
      - name: Fuentes del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core \
            fonts-dejavu-extra \
            fonts-noto-color-emoji

      # uv fijado a la misma versión que usa el Dockerfile: el lockfile
      # declara version = 1, revision = 3 y tiene que poder leerlo.
      - name: uv
        run: pip install uv==0.12.19

      - name: Dependencias
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type checking
        run: uv run ty check

      - name: Tests
        run: uv run python -m unittest discover -s tests -v
