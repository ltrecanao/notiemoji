<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>notiemoji</title>
  <meta name="description" content="Generá wallpapers PNG con texto y emojis.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="marca">notiemoji</h1>
  </header>

  <main class="app">
    <aside class="panel-controles">
      <form id="form" class="form">
        <div class="grupo">
          <label for="text">Texto</label>
          <input type="text" id="text" name="text" value="notiemoji 🎨" placeholder="Escribí texto o emojis" autocomplete="off">
        </div>

        <div class="grupo">
          <label for="palette">Paleta</label>
          <select id="palette" name="palette">
            <option value="">Personalizado</option>
          </select>
        </div>

        <div class="grupo">
          <label>Tamaño</label>
          <div class="tamano-preset">
            <button type="button" class="btn btn-mini" data-w="1920" data-h="1080">Horizontal</button>
            <button type="button" class="btn btn-mini" data-w="1080" data-h="1920">Vertical</button>
            <button type="button" class="btn btn-mini" data-w="1080" data-h="1080">Cuadrado</button>
          </div>
          <div class="tamano-custom">
            <div class="campo">
              <label for="width">Ancho</label>
              <input type="number" id="width" name="width" value="1920" min="1" max="4000">
            </div>
            <div class="campo">
              <label for="height">Alto</label>
              <input type="number" id="height" name="height" value="1080" min="1" max="4000">
            </div>
          </div>
        </div>

        <div class="grupo">
          <label for="font_size">Tamaño de fuente</label>
          <input type="range" id="font_size" name="font_size" min="24" max="400" value="96">
          <span id="font_size_val" class="valor">96px</span>
        </div>

        <div class="grupo">
          <label>Estilo</label>
          <div class="estilos">
            <label class="check"><input type="checkbox" id="bold" name="bold"> <span>Negrita</span></label>
            <label class="check"><input type="checkbox" id="italic" name="italic"> <span>Cursiva</span></label>
          </div>
        </div>

        <div class="grupo">
          <label for="color">Color de fondo</label>
          <div class="color-picker">
            <input type="color" id="color-picker" value="#101010">
            <input type="text" id="color" name="color" placeholder="#101010">
          </div>
        </div>

        <div class="grupo">
          <label for="text_color">Color de texto</label>
          <div class="color-picker">
            <input type="color" id="text-color-picker" value="#ff50ff">
            <input type="text" id="text_color" name="text_color" placeholder="#ff50ff">
          </div>
        </div>

        <button type="submit" id="generar" class="btn btn-acento btn-block">Generar</button>
      </form>
    </aside>

    <section class="panel-preview" aria-label="Vista previa">
      <div id="preview-vacio" class="vacio">
        <p>Configurá los parámetros y tocá <strong>Generar</strong></p>
      </div>
      <div id="preview-container" class="preview-container" hidden>
        <img id="preview-img" alt="Wallpaper generado">
        <a id="descargar" class="btn btn-acento btn-descargar" download="wallpaper.png">Descargar PNG</a>
      </div>
    </section>
  </main>

  <div id="toasts" class="toasts"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
